# Datenbankeinstellungen fuer die JUnit Tests
# Falls die Werte durch Umgebungsvariablen umgeschrieben werden sollen,
# muss das folgende Format fuer die Schluesseleigenschaften verwendet
# werden:
#
# hibernate_connection_username     => betoffice.persistence.username
# hibernate_connection_password     => betoffice.persistence.password
# hibernate_connection_url          => betoffice.persistence.url 
# hibernate_connection_driver_class => betoffice.persistence.classname  
# hibernate_dialect                 => betoffice.persistence.dialect 
#
   
betoffice.persistence.username = betofficetest
betoffice.persistence.password = xxx
# betoffice.persistence.url = jdbc:mariadb://127.0.0.1/botest?connectionTimeZone=UTC+2
betoffice.persistence.url = jdbc:mariadb://127.0.0.1/betofficetest
betoffice.persistence.classname = org.mariadb.jdbc.Driver
betoffice.persistence.dialect = org.hibernate.dialect.MariaDBDialect

betoffice.mail.enabled = true
betoffice.mail.username =
betoffice.mail.password =
betoffice.mail.host = 127.0.0.1
betoffice.mail.port = 3025
betoffice.mail.smtpauth = false
betoffice.mail.starttlsenable = false
betoffice.mail.confirm.url = not defined for the test profile
 